[probe]
; ms after the winner banner appears before it is frozen on screen
FreezeMs=700

[teams]
; room names exactly as the log prints them; empty = first two rooms with cats
Team1Room=
Team2Room=
; cats per side, 1..4 (the arena has 4 spawns per side)
TeamSize=4

[items]
; none = bare (as in the house), random = every cat its own random kit,
; balanced = random but team 2 cat N gets team 1 cat N's kit, house = from the house storage
Preset=random
; items per cat, 0..5
PerCat=2
; house only: 1 = team 2 cat N gets the same kit as team 1 cat N
Mirror=1
